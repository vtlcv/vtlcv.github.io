
name: Instagram public-page diagnostic

on:
  push:
    branches:
      - test/instagram-public-check

permissions:
  contents: read

jobs:
  public-page-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/instagram-public-check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check public Instagram profile page
        run: python instagram_public_check.py eatdrinkplayshare
